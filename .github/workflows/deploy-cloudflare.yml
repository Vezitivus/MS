name: Deploy Cloudflare Backend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      MIGRATION_SECRET: ${{ secrets.MIGRATION_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID D1_DATABASE_ID MIGRATION_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub secret: $name"
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm install

      - name: Insert D1 database ID into temporary config
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'wrangler.jsonc';
          const databaseId = process.env.D1_DATABASE_ID;
          let config = fs.readFileSync(file, 'utf8');
          config = config.replace('REPLACE_WITH_D1_DATABASE_ID', databaseId);
          if (!config.includes(databaseId)) {
            throw new Error('D1 database ID could not be inserted into wrangler.jsonc');
          }
          fs.writeFileSync(file, config);
          NODE

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply vezitivus-ms-db --remote --yes

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Store migration secret in Cloudflare
        shell: bash
        run: printf '%s' "$MIGRATION_SECRET" | npx wrangler secret put MIGRATION_SECRET

      - name: Deployment complete
        run: |
          echo "Cloudflare backend deployed."
          echo "Open Cloudflare Dashboard > Workers & Pages > vezitivus-ms-api to copy the workers.dev URL."
