<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ff4fd8" />
  <title>Spied šeit</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: #12051e;
      color: white;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 22px;
      transition: opacity .42s ease, transform .42s ease, visibility .42s;
    }

    .screen.hidden {
      opacity: 0;
      transform: scale(1.05);
      visibility: hidden;
      pointer-events: none;
    }

    #startScreen {
      background:
        radial-gradient(circle at 16% 18%, rgba(255,255,255,.42), transparent 17%),
        radial-gradient(circle at 82% 76%, rgba(255,240,91,.58), transparent 19%),
        linear-gradient(135deg, #ff4fd8, #7b5cff 34%, #32ddff 67%, #65ff9a);
      background-size: 180% 180%;
      animation: rainbowMove 6s ease-in-out infinite alternate;
    }

    #startScreen::before,
    #startScreen::after {
      content: "✦  ✧  ★  ✦  ✧  ★  ✦";
      position: fixed;
      white-space: nowrap;
      font-size: clamp(24px, 7vw, 70px);
      letter-spacing: .38em;
      color: rgba(255,255,255,.68);
      filter: drop-shadow(0 0 12px rgba(255,255,255,.75));
      animation: sparkleFloat 5s ease-in-out infinite alternate;
      pointer-events: none;
    }

    #startScreen::before { top: 6%; left: -5%; transform: rotate(-10deg); }
    #startScreen::after { bottom: 7%; right: -8%; transform: rotate(10deg); animation-delay: -2.5s; }

    @keyframes rainbowMove {
      to { background-position: 100% 100%; }
    }

    @keyframes sparkleFloat {
      to { translate: 20px -18px; rotate: 4deg; }
    }

    .start-card {
      position: relative;
      z-index: 2;
      width: min(92vw, 560px);
      min-height: min(72svh, 620px);
      display: grid;
      place-items: center;
      padding: 34px 22px;
      border: 2px solid rgba(255,255,255,.6);
      border-radius: 42px;
      background: rgba(255,255,255,.16);
      backdrop-filter: blur(26px) saturate(1.35);
      box-shadow:
        0 34px 90px rgba(60,0,90,.34),
        inset 0 1px 0 rgba(255,255,255,.65),
        0 0 45px rgba(255,255,255,.18);
      text-align: center;
    }

    .eyebrow {
      margin-bottom: 34px;
      font-size: 13px;
      font-weight: 950;
      letter-spacing: .22em;
      text-transform: uppercase;
      text-shadow: 0 2px 14px rgba(74,0,90,.45);
    }

    .press-button {
      position: relative;
      width: min(70vw, 315px);
      aspect-ratio: 1;
      border: 4px solid rgba(255,255,255,.85);
      border-radius: 50%;
      cursor: pointer;
      color: white;
      background:
        radial-gradient(circle at 35% 24%, rgba(255,255,255,.92), transparent 14%),
        radial-gradient(circle at 50% 55%, #ff80ec 0, #ff2fc7 43%, #b30095 100%);
      box-shadow:
        0 25px 0 #83006d,
        0 35px 70px rgba(104,0,112,.48),
        0 0 0 14px rgba(255,255,255,.2),
        0 0 55px rgba(255,255,255,.6),
        inset 0 5px 18px rgba(255,255,255,.75),
        inset 0 -14px 22px rgba(92,0,79,.35);
      transform: translateY(-8px);
      transition: transform .12s ease, box-shadow .12s ease, filter .2s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .press-button::before {
      content: "";
      position: absolute;
      inset: -24px;
      border-radius: 50%;
      border: 4px dashed rgba(255,255,255,.72);
      animation: spin 8s linear infinite;
    }

    .press-button::after {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,.35);
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .press-button:active,
    .press-button.pressed {
      transform: translateY(15px) scale(.985);
      box-shadow:
        0 4px 0 #83006d,
        0 18px 34px rgba(104,0,112,.38),
        0 0 0 14px rgba(255,255,255,.16),
        0 0 42px rgba(255,255,255,.5),
        inset 0 5px 18px rgba(255,255,255,.58),
        inset 0 -10px 16px rgba(92,0,79,.38);
    }

    .button-text {
      position: relative;
      z-index: 2;
      display: block;
      font-size: clamp(32px, 8vw, 56px);
      font-weight: 1000;
      letter-spacing: -.055em;
      line-height: .92;
      text-shadow: 0 4px 0 rgba(105,0,87,.32), 0 0 18px rgba(255,255,255,.35);
    }

    .hint {
      margin-top: 48px;
      font-size: 16px;
      font-weight: 850;
      text-shadow: 0 2px 14px rgba(65,0,90,.42);
    }

    #revealScreen {
      background:
        radial-gradient(circle at 12% 18%, rgba(255,45,205,.45), transparent 27%),
        radial-gradient(circle at 86% 22%, rgba(52,223,255,.35), transparent 28%),
        radial-gradient(circle at 72% 82%, rgba(255,237,65,.28), transparent 24%),
        linear-gradient(135deg, #16001f, #2c0647 48%, #07182b);
      overflow: hidden;
    }

    #revealScreen::before {
      content: "";
      position: fixed;
      inset: -40%;
      background: conic-gradient(from 0deg, transparent, rgba(255,48,205,.18), transparent, rgba(45,219,255,.16), transparent, rgba(255,230,56,.14), transparent);
      animation: spin 10s linear infinite;
      pointer-events: none;
    }

    .reveal-wrap {
      position: relative;
      z-index: 2;
      width: 100%;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 30px 10px;
      overflow: visible;
    }

    .final-stage {
      width: calc(100vw - 20px);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: visible;
    }

    .final-text {
      display: inline-flex;
      flex-wrap: nowrap;
      justify-content: center;
      align-items: flex-end;
      white-space: nowrap;
      gap: 0;
      width: max-content;
      max-width: none;
      transform-origin: center center;
      font-size: clamp(54px, 10vw, 118px);
      font-weight: 1000;
      line-height: .9;
      letter-spacing: -.072em;
      text-transform: uppercase;
      filter: drop-shadow(0 12px 24px rgba(0,0,0,.55));
    }

    .letter {
      display: inline-block;
      flex: 0 0 auto;
      opacity: 0;
      transform: translate(var(--x), -125vh) rotate(var(--rot)) scale(.62);
      color: hsl(var(--hue) 100% 67%);
      text-shadow:
        0 0 8px currentColor,
        0 0 22px currentColor,
        0 4px 0 rgba(255,255,255,.18);
      transition: none;
    }

    .letter.space {
      width: .27em;
      min-width: .27em;
    }

    .letter.drop {
      animation: letterDrop .9s cubic-bezier(.15,.72,.18,1.2) forwards;
    }

    @keyframes letterDrop {
      0% {
        opacity: 0;
        transform: translate(var(--x), -125vh) rotate(var(--rot)) scale(.62);
      }
      70% {
        opacity: 1;
        transform: translate(calc(var(--x) * .04), 11px) rotate(calc(var(--rot) * -.10)) scale(1.06);
      }
      84% {
        transform: translate(0, -5px) rotate(2deg) scale(.985);
      }
      100% {
        opacity: 1;
        transform: translate(0, 0) rotate(0deg) scale(1);
      }
    }

    .flash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(135deg, #ff4fd8, #fff36b, #4de7ff);
      opacity: 0;
      z-index: 5;
    }

    .flash.active { animation: flash .5s ease-out; }

    @keyframes flash {
      0% { opacity: .95; }
      100% { opacity: 0; }
    }

    .restart {
      position: fixed;
      z-index: 6;
      left: 50%;
      bottom: max(22px, env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(20px);
      border: 2px solid rgba(255,255,255,.55);
      border-radius: 999px;
      padding: 13px 22px;
      color: white;
      background: linear-gradient(135deg, rgba(255,57,208,.75), rgba(103,75,255,.75));
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 28px rgba(0,0,0,.3), 0 0 24px rgba(255,67,220,.35);
      font: inherit;
      font-weight: 900;
      opacity: 0;
      pointer-events: none;
      transition: .35s ease;
    }

    .restart.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    @media (max-width: 480px) {
      .start-card { min-height: 72svh; border-radius: 32px; }
      .press-button { width: min(72vw, 285px); }
      .final-text { font-size: 72px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <section id="startScreen" class="screen">
    <div class="start-card">
      <div>
        <div class="eyebrow">Šī poga grib, lai tu viņu nospied</div>
        <button id="pressButton" class="press-button" aria-label="Spied šeit">
          <span class="button-text">SPIED<br>ŠEIT</span>
        </button>
        <div class="hint">Nu spied taču ✨</div>
      </div>
    </div>
  </section>

  <section id="revealScreen" class="screen hidden" aria-live="polite">
    <div class="reveal-wrap">
      <div class="final-stage">
        <div id="finalText" class="final-text"></div>
      </div>
    </div>
    <button id="restart" class="restart">VĒLREIZ ✨</button>
  </section>

  <div id="flash" class="flash"></div>

  <script>
    const message = 'SŪKĀ LIKO APDAUZĪTO 🖕🏻';
    const startScreen = document.getElementById('startScreen');
    const revealScreen = document.getElementById('revealScreen');
    const pressButton = document.getElementById('pressButton');
    const finalText = document.getElementById('finalText');
    const restart = document.getElementById('restart');
    const flash = document.getElementById('flash');

    let audioCtx;
    let running = false;

    function graphemes(text) {
      if (window.Intl && Intl.Segmenter) {
        return [...new Intl.Segmenter('lv', { granularity: 'grapheme' }).segment(text)].map(item => item.segment);
      }
      return Array.from(text);
    }

    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function tone(freq, duration, type = 'sine', volume = 0.05, delay = 0) {
      try {
        audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const start = audioCtx.currentTime + delay;
        osc.type = type;
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(volume, start + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + duration + 0.03);
      } catch (_) {}
    }

    function clickSound() {
      tone(120, .12, 'square', .07);
      tone(70, .24, 'sine', .10, .02);
    }

    function dropSound(index) {
      const notes = [247, 294, 330, 392, 440, 523, 587];
      tone(notes[index % notes.length], .13, 'triangle', .035);
    }

    function finishSound() {
      [262, 330, 392, 523, 659].forEach((freq, index) => tone(freq, .5, 'sine', .04, index * .045));
    }

    function fitText() {
      finalText.style.transform = 'scale(1)';
      const available = window.innerWidth - 22;
      const natural = finalText.scrollWidth;
      const scale = Math.min(1, available / natural);
      finalText.style.transform = `scale(${scale})`;
    }

    function buildLetters() {
      finalText.innerHTML = '';
      const chars = graphemes(message);

      chars.forEach((char, index) => {
        const span = document.createElement('span');
        span.className = 'letter' + (char === ' ' ? ' space' : '');
        span.textContent = char === ' ' ? '\u00A0' : char;
        span.style.setProperty('--rot', `${(Math.random() * 160 - 80).toFixed(1)}deg`);
        span.style.setProperty('--x', `${Math.round(Math.random() * 180 - 90)}vw`);
        span.style.setProperty('--hue', Math.floor(Math.random() * 360));
        span.dataset.index = index;
        finalText.appendChild(span);
      });

      requestAnimationFrame(fitText);
      return [...finalText.children];
    }

    async function reveal() {
      if (running) return;
      running = true;
      pressButton.classList.add('pressed');
      clickSound();

      await new Promise(resolve => setTimeout(resolve, 170));
      startScreen.classList.add('hidden');
      revealScreen.classList.remove('hidden');
      flash.classList.add('active');
      setTimeout(() => flash.classList.remove('active'), 520);

      const letters = buildLetters();
      const fallingOrder = shuffle(letters.filter(letter => !letter.classList.contains('space')));
      const spaces = letters.filter(letter => letter.classList.contains('space'));
      spaces.forEach(space => {
        space.style.opacity = '1';
        space.style.transform = 'none';
      });

      fallingOrder.forEach((letter, orderIndex) => {
        setTimeout(() => {
          letter.classList.add('drop');
          dropSound(orderIndex);

          if (orderIndex === fallingOrder.length - 1) {
            setTimeout(() => {
              finishSound();
              restart.classList.add('show');
              running = false;
            }, 900);
          }
        }, 120 + orderIndex * 135);
      });
    }

    function reset() {
      restart.classList.remove('show');
      revealScreen.classList.add('hidden');
      startScreen.classList.remove('hidden');
      pressButton.classList.remove('pressed');
      finalText.innerHTML = '';
      finalText.style.transform = 'scale(1)';
      running = false;
    }

    pressButton.addEventListener('click', reveal);
    restart.addEventListener('click', reset);
    window.addEventListener('resize', () => {
      if (finalText.children.length) fitText();
    });
  </script>
</body>
</html>
