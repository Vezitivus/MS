<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f1ea" />
  <title>Spied šeit</title>
  <style>
    :root {
      --bg: #f5f1ea;
      --ink: #171717;
      --accent: #ff4b2b;
      --accent-dark: #d93618;
      --card: rgba(255,255,255,.72);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    body::before {
      content: "";
      position: fixed;
      inset: -30%;
      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,.95), transparent 30%),
        radial-gradient(circle at 75% 70%, rgba(255,75,43,.12), transparent 28%);
      animation: drift 9s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes drift {
      to { transform: translate3d(3%, -2%, 0) scale(1.04); }
    }

    .screen {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      transition: opacity .45s ease, transform .45s ease, visibility .45s;
    }

    .screen.hidden {
      opacity: 0;
      transform: scale(1.035);
      visibility: hidden;
      pointer-events: none;
    }

    .start-card {
      width: min(92vw, 560px);
      min-height: min(72vh, 620px);
      display: grid;
      place-items: center;
      padding: 34px;
      border: 1px solid rgba(23,23,23,.08);
      border-radius: 38px;
      background: var(--card);
      backdrop-filter: blur(22px);
      box-shadow: 0 30px 80px rgba(23,23,23,.12);
      text-align: center;
    }

    .eyebrow {
      margin-bottom: 32px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .28em;
      text-transform: uppercase;
      opacity: .45;
    }

    .press-button {
      position: relative;
      width: min(68vw, 310px);
      aspect-ratio: 1;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      color: white;
      background:
        radial-gradient(circle at 34% 25%, rgba(255,255,255,.72), transparent 17%),
        linear-gradient(145deg, #ff6b4d, var(--accent) 48%, var(--accent-dark));
      box-shadow:
        0 24px 0 #b92b12,
        0 38px 70px rgba(217,54,24,.34),
        inset 0 4px 12px rgba(255,255,255,.48),
        inset 0 -12px 18px rgba(115,19,5,.25);
      transform: translateY(-8px);
      transition: transform .12s ease, box-shadow .12s ease, filter .2s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .press-button::before {
      content: "";
      position: absolute;
      inset: -18px;
      border-radius: 50%;
      border: 2px solid rgba(255,75,43,.2);
      animation: pulse 1.8s ease-out infinite;
    }

    .press-button::after {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.3);
    }

    @keyframes pulse {
      0% { transform: scale(.92); opacity: 0; }
      28% { opacity: 1; }
      100% { transform: scale(1.16); opacity: 0; }
    }

    .press-button:hover { filter: saturate(1.08) brightness(1.03); }

    .press-button:active,
    .press-button.pressed {
      transform: translateY(14px) scale(.985);
      box-shadow:
        0 5px 0 #b92b12,
        0 18px 34px rgba(217,54,24,.26),
        inset 0 4px 12px rgba(255,255,255,.34),
        inset 0 -8px 14px rgba(115,19,5,.28);
    }

    .button-text {
      position: relative;
      z-index: 2;
      display: block;
      font-size: clamp(30px, 8vw, 54px);
      font-weight: 950;
      letter-spacing: -.05em;
      line-height: .95;
      text-shadow: 0 3px 0 rgba(92,18,5,.18);
    }

    .hint {
      margin-top: 46px;
      font-size: 15px;
      font-weight: 650;
      opacity: .5;
    }

    #revealScreen {
      background: #111;
      color: #fff;
      overflow: hidden;
    }

    .reveal-wrap {
      position: relative;
      z-index: 2;
      width: min(94vw, 1100px);
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
    }

    .final-text {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-end;
      gap: .05em;
      max-width: 100%;
      text-align: center;
      font-size: clamp(38px, 10vw, 112px);
      font-weight: 1000;
      line-height: .92;
      letter-spacing: -.065em;
      text-transform: uppercase;
      text-wrap: balance;
      filter: drop-shadow(0 12px 30px rgba(0,0,0,.42));
    }

    .letter {
      display: inline-block;
      min-width: .34em;
      opacity: 0;
      transform: translateY(-120vh) rotate(var(--rot)) scale(.72);
      color: hsl(var(--hue) 92% 62%);
      transition: none;
    }

    .letter.space { min-width: .28em; }

    .letter.drop {
      animation: letterDrop .74s cubic-bezier(.18,.72,.22,1.22) forwards;
    }

    @keyframes letterDrop {
      0% {
        opacity: 0;
        transform: translateY(-120vh) rotate(var(--rot)) scale(.72);
      }
      72% {
        opacity: 1;
        transform: translateY(7px) rotate(calc(var(--rot) * -.12)) scale(1.04);
      }
      86% {
        transform: translateY(-4px) rotate(0deg) scale(.99);
      }
      100% {
        opacity: 1;
        transform: translateY(0) rotate(0deg) scale(1);
      }
    }

    .flash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: white;
      opacity: 0;
      z-index: 5;
    }

    .flash.active { animation: flash .42s ease-out; }

    @keyframes flash {
      0% { opacity: .95; }
      100% { opacity: 0; }
    }

    .restart {
      position: fixed;
      left: 50%;
      bottom: max(22px, env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(20px);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 999px;
      padding: 12px 18px;
      color: white;
      background: rgba(255,255,255,.08);
      backdrop-filter: blur(10px);
      font: inherit;
      font-weight: 750;
      opacity: 0;
      pointer-events: none;
      transition: .35s ease;
    }

    .restart.show {
      opacity: .72;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    @media (max-width: 480px) {
      .start-card { min-height: 70svh; border-radius: 30px; }
      .press-button { width: min(72vw, 285px); }
      .final-text { font-size: clamp(34px, 12vw, 66px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <section id="startScreen" class="screen">
    <div class="start-card">
      <div>
        <div class="eyebrow">Tev tas ir jāizdara</div>
        <button id="pressButton" class="press-button" aria-label="Spied šeit">
          <span class="button-text">SPIED<br>ŠEIT</span>
        </button>
        <div class="hint">Nospied. Nekas slikts nenotiks.</div>
      </div>
    </div>
  </section>

  <section id="revealScreen" class="screen hidden" aria-live="polite">
    <div class="reveal-wrap">
      <div id="finalText" class="final-text"></div>
    </div>
    <button id="restart" class="restart">Vēlreiz</button>
  </section>

  <div id="flash" class="flash"></div>

  <script>
    const message = 'SŪKĀ LIKO APDAUZĪTO 🖕🏻';
    const startScreen = document.getElementById('startScreen');
    const revealScreen = document.getElementById('revealScreen');
    const pressButton = document.getElementById('pressButton');
    const finalText = document.getElementById('finalText');
    const restart = document.getElementById('restart');
    const flash = document.getElementById('flash');

    let audioCtx;
    let running = false;

    function tone(freq, duration, type = 'sine', volume = 0.05, delay = 0) {
      try {
        audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const start = audioCtx.currentTime + delay;
        osc.type = type;
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(volume, start + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + duration + 0.03);
      } catch (_) {}
    }

    function clickSound() {
      tone(95, .12, 'square', .08);
      tone(54, .22, 'sine', .12, .03);
    }

    function dropSound(index) {
      const scale = [220, 247, 277, 330, 370, 415];
      tone(scale[index % scale.length], .11, 'triangle', .035);
    }

    function finishSound() {
      [262, 330, 392, 523].forEach((f, i) => tone(f, .45, 'sine', .045, i * .055));
    }

    function buildLetters() {
      finalText.innerHTML = '';
      Array.from(message).forEach((char, index) => {
        const span = document.createElement('span');
        span.className = 'letter' + (char === ' ' ? ' space' : '');
        span.textContent = char === ' ' ? '\u00A0' : char;
        span.style.setProperty('--rot', `${(Math.random() * 70 - 35).toFixed(1)}deg`);
        span.style.setProperty('--hue', Math.floor(Math.random() * 360));
        span.dataset.index = index;
        finalText.appendChild(span);
      });
    }

    async function reveal() {
      if (running) return;
      running = true;
      pressButton.classList.add('pressed');
      clickSound();

      await new Promise(r => setTimeout(r, 170));
      startScreen.classList.add('hidden');
      revealScreen.classList.remove('hidden');
      flash.classList.add('active');
      setTimeout(() => flash.classList.remove('active'), 450);

      buildLetters();
      const letters = [...finalText.children];

      letters.forEach((letter, i) => {
        setTimeout(() => {
          letter.classList.add('drop');
          if (!letter.classList.contains('space')) dropSound(i);

          if (i === letters.length - 1) {
            setTimeout(() => {
              finishSound();
              restart.classList.add('show');
              running = false;
            }, 760);
          }
        }, 130 + i * 145);
      });
    }

    function reset() {
      restart.classList.remove('show');
      revealScreen.classList.add('hidden');
      startScreen.classList.remove('hidden');
      pressButton.classList.remove('pressed');
      finalText.innerHTML = '';
      running = false;
    }

    pressButton.addEventListener('click', reveal);
    restart.addEventListener('click', reset);
  </script>
</body>
</html>
