    html, body {

      width: 100%;

      inset: 0;
      z-index: 20;
      pointer-events: none;

      mix-blend-mode: overlay;

    .screen {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      transition: opacity .5s ease, visibility .5s;

    .screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;

        linear-gradient(180deg, #0a100e 0%, #050806 48%, #030504 100%);

    #startScreen::before,
    #startScreen::after {
      content: "";
      position: absolute;
      pointer-events: none;
    }

      inset: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
      border: 1px solid rgba(212, 175, 85, .22);
    }

    #startScreen::after {
      inset: max(18px, calc(env(safe-area-inset-top) + 4px)) max(18px, calc(env(safe-area-inset-right) + 4px)) max(18px, calc(env(safe-area-inset-bottom) + 4px)) max(18px, calc(env(safe-area-inset-left) + 4px));
      border: 1px solid rgba(212, 175, 85, .1);
    }

    .start-inner {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: min(100%, 420px);
    }

    .counter {
      margin: 0 0 28px;
      opacity: 0;
      transform: translateY(-6px);
      pointer-events: none;
      transition: opacity .45s ease, transform .45s ease;
    }

    .counter.show {
      opacity: 1;
      transform: none;
      pointer-events: auto;
    }

    .counter-digits {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      min-height: 1.15em;
      font-size: 26px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      letter-spacing: .06em;
      line-height: 1;
      color: #f0d176;
      text-shadow: 0 0 18px rgba(240, 209, 118, .35), 0 1px 0 rgba(80, 50, 0, .45);
    }

    .digit {
      display: inline-block;
      height: 1.15em;
      overflow: hidden;
      width: .68em;
      text-align: center;
    }

    .digit.comma,
    .digit.lit {
      width: auto;
      min-width: .36em;
      overflow: visible;
    }

    .digit-reel {
      display: block;
      transition: transform .7s cubic-bezier(.2, .8, .2, 1);
      will-change: transform;
    }

    .digit-reel span {
      display: block;
      height: 1.15em;
      line-height: 1.15em;

    .counter-label {

    .hint {

    .deco-rule {
      width: min(72%, 220px);
      height: 10px;
      margin: 8px 0 22px;
      position: relative;

    .deco-rule::before,
    .deco-rule::after {
      content: "";
      position: absolute;
      top: 50%;
      width: calc(50% - 9px);
      height: 1px;
      background: linear-gradient(90deg, transparent, #d4af55);
    }

    .deco-rule::before { left: 0; transform: translateY(-50%); }
    .deco-rule::after {
      right: 0;
      background: linear-gradient(90deg, #d4af55, transparent);
      transform: translateY(-50%);

      left: 50%;
      top: 50%;

      border: 1px solid #d4af55;

      box-shadow: 0 0 8px rgba(212, 175, 85, .45);

      background: transparent;

      -webkit-tap-highlight-color: transparent;

    .btn-face {

    .btn-sheen {

      left: 14%;
      top: 8%;
      width: 54%;
      height: 36%;
      border-radius: 50%;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(255, 255, 255, .7), rgba(255, 255, 255, .08) 58%, transparent 80%);

      left: -60%;
      width: 45%;

      38% { opacity: .7; }

    #revealScreen {

    .final-stage {

    .final-text {

      align-items: center;
      white-space: nowrap;
      width: max-content;

    .letter {
      display: inline-block;
      flex: 0 0 auto;
      opacity: 0;
      will-change: transform, opacity;
      margin-right: -.04em;

    .letter.space {

      margin-right: 0;

    .restart {
      position: fixed;
      z-index: 6;
      left: 50%;
      bottom: max(26px, calc(env(safe-area-inset-bottom) + 12px));

      font-weight: 650;

      transition: opacity .45s ease, transform .45s ease, background .15s ease;

    }

    .restart.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    .restart:active {
      background: rgba(212, 175, 85, .16);
      transform: translateX(-50%) translateY(1px) scale(.98);

    @media (max-width: 480px) {
      .counter { margin-bottom: 22px; }
      .counter-digits { font-size: 24px; }
      .press-button { width: min(66vw, 236px); }
      .final-text { font-size: 64px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .btn-glow, .btn-shimmer, .sparkle { animation: none; }
      .digit-reel { transition: none; }
      .screen { transition: opacity .2s ease, visibility .2s; }
      .restart { transition: opacity .2s ease, transform .2s ease; }
    }
  </style>

      try {

        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(volume, start + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + duration + 0.03);

      return new Intl.NumberFormat('en-US').format(Math.max(0, Math.floor(Number(n) || 0)));

    function renderCounter(value, animate) {
      const text = formatCount(value);
      const previous = lastUnique;
      lastUnique = value;
      counterDigits.textContent = '';
      const fromText = previous == null || !animate ? text : formatCount(previous);
      const maxLen = Math.max(text.length, fromText.length);
      const fromPad = fromText.padStart(maxLen, ' ');
      const toPad = text.padStart(maxLen, ' ');

        const span = document.createElement('span');

          span.className = 'digit ' + (ch === ',' ? 'comma' : 'lit');
          span.textContent = ch === ' ' ? '' : ch;
          counterDigits.appendChild(span);
          continue;
        }
        if (!/\d/.test(ch)) {
          span.className = 'digit lit';
          span.textContent = ch;
          counterDigits.appendChild(span);
          continue;
        }
        span.className = 'digit';
        const reel = document.createElement('span');
        reel.className = 'digit-reel';
        const startDigit = /\d/.test(fromPad[i]) ? Number(fromPad[i]) : 0;
        const endDigit = Number(ch);
        for (let d = 0; d <= 9; d++) {
          const n = document.createElement('span');
          n.textContent = String(d);
          reel.appendChild(n);
        }
        span.appendChild(reel);
        counterDigits.appendChild(span);
        reel.style.transform = `translateY(${-startDigit * 1.15}em)`;
        const lock = endDigit;
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            reel.style.transform = `translateY(${-lock * 1.15}em)`;
          });
        });
      }
      counterEl.classList.add('show');
    }

    async function loadCount() {
      try {
        const res = await fetch(`${API}/count`);
        if (!res.ok) throw new Error('count failed');
        const data = await res.json();
        renderCounter(data.unique, false);
      } catch (_) {
        counterEl.classList.remove('show');
      }
    }

    async function sendPress() {
      try {
        const res = await fetch(`${API}/press`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ visitor: visitorId() })
        });
        if (!res.ok) throw new Error('press failed');
        const data = await res.json();
        renderCounter(data.unique, true);
      } catch (_) {
        if (lastUnique == null) counterEl.classList.remove('show');
      }
    }

    let deck = [];
    let lastLine = null;

    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function nextLine() {
      if (deck.length === 0) {
        deck = shuffle(LINES);
        if (lastLine && deck.length > 1 && deck[0] === lastLine) {
          const swapAt = Math.max(1, deck.findIndex((line, index) => index > 0 && line !== lastLine));
          [deck[0], deck[swapAt]] = [deck[swapAt], deck[0]];
        }
      }
      lastLine = deck.shift();
      return lastLine;
    }

    function visualLen(text) {
      return graphemes(text).reduce((sum, char) => {
        if (char === ' ' || char === '\u00A0') return sum + 0.28;
        if (char.length > 1 || /\p{Extended_Pictographic}/u.test(char)) return sum + 1.15;
        return sum + 0.72;
      }, 0);
    }

    function bestSplit(text) {
      const words = text.split(' ');
      if (words.length < 2) return [text];
      let bestAt = 1;
      let bestScore = Infinity;
      for (let i = 1; i < words.length; i++) {
        const a = words.slice(0, i).join(' ');
        const b = words.slice(i).join(' ');
        const lonely = words.length >= 4 && (i === 1 || i === words.length - 1);
        const score = Math.abs(visualLen(a) - visualLen(b)) + (lonely ? 3 : 0);
        if (score < bestScore) {
          bestScore = score;
          bestAt = i;
        }
      }
      return [words.slice(0, bestAt).join(' '), words.slice(bestAt).join(' ')];
    }

    function renderRows(rows) {
      finalText.innerHTML = '';
      finalText.style.fontSize = '';
      const letters = [];
      rows.forEach((row) => {
        const line = document.createElement('div');
        line.className = 'final-line';
        graphemes(row).forEach((char) => {
          const span = document.createElement('span');
          span.className = 'letter' + (char === ' ' ? ' space' : '');
          span.textContent = char === ' ' ? '\u00A0' : char;
          line.appendChild(span);
          letters.push(span);
        });
        finalText.appendChild(line);
      });
      return letters;
    }

    function fitText() {
      const availableW = Math.max(120, window.innerWidth - 48);
      const availableH = Math.max(90, window.innerHeight - 180);
      finalText.style.fontSize = '';
      const base = parseFloat(getComputedStyle(finalText).fontSize);
      if (!base) return 28;
      let lo = 28;
      let hi = base;
      let best = 28;
      for (let i = 0; i < 14; i++) {
        const mid = (lo + hi) / 2;
        finalText.style.fontSize = `${mid}px`;
        const box = finalText.getBoundingClientRect();
        const lineOverflow = [...finalText.querySelectorAll('.final-line')]
          .some((line) => line.getBoundingClientRect().width > availableW);
        if (box.width <= availableW && box.height <= availableH && !lineOverflow) {
          best = mid;
          lo = mid;
        } else {
          hi = mid;
        }
      }
      finalText.style.fontSize = `${best}px`;
      return best;
    }

    function prepareLine(message) {
      renderRows([message]);
      const oneSize = fitText();
      if (message.includes(' ')) {
        renderRows(bestSplit(message));
        const twoSize = fitText();
        if (oneSize >= twoSize - 4) {
          renderRows([message]);
          fitText();
        }
      }
      return [...finalText.querySelectorAll('.letter')];
    }

    function buildLetters(message) {
      return prepareLine(message);
    }

    function layoutLine(message, visible = true) {
      startScreen.classList.add('hidden');
      revealScreen.classList.remove('hidden');
      const letters = prepareLine(message);
      if (visible) {
        letters.forEach((letter) => {
          letter.style.opacity = '1';
          letter.style.transform = 'none';
        });
        restart.classList.add('show');
      }
      return letters;
    }

    function easeOutBackSoft(t) {
      const c1 = 1.18;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    }

    function easeOutQuart(t) {
      return 1 - Math.pow(1 - t, 4);
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function waitFrames(n = 2) {
      return new Promise((resolve) => {
        const step = () => {
          n -= 1;
          if (n <= 0) resolve();
          else requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      });
    }

    function offscreenStart(hx, hy, vw, vh) {
      const sides = ['top', 'bottom', 'left', 'right'];
      const side = sides[Math.floor(Math.random() * 4)];
      const pad = 90 + Math.random() * 160;
      if (side === 'top') return { x: Math.random() * vw - hx, y: -pad - hy, side };
      if (side === 'bottom') return { x: Math.random() * vw - hx, y: vh + pad - hy, side };
      if (side === 'left') return { x: -pad - hx, y: Math.random() * vh - hy, side };
      return { x: vw + pad - hx, y: Math.random() * vh - hy, side };
    }

    function makeStates(letters) {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      return letters.map((el) => {
        if (el.classList.contains('space')) return { el, space: true };
        const rect = el.getBoundingClientRect();
        const hx = rect.left + rect.width / 2;
        const hy = rect.top + rect.height / 2;
        const start = offscreenStart(hx, hy, vw, vh);
        return {
          el,
          space: false,
          x0: start.x,
          y0: start.y,
          mx: (Math.random() * 2 - 1) * 160,
          my: (Math.random() * 2 - 1) * 120,
          rot0: (Math.random() * 2 - 1) * 320,
          scale0: 0.55 + Math.random() * 0.7,
          delay: 30 + Math.random() * 420,
          flight: FLIGHT_MS + Math.random() * 280,
          started: false,
          locked: false
        };
      });
    }

    function applyLetter(el, x, y, rot, scale, opacity) {
      el.style.opacity = String(opacity);
      el.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg) scale(${scale})`;
    }

    function animateLetters(states) {
      return new Promise((resolve) => {
        const start = performance.now();
        let dropCount = 0;

        const tick = (now) => {
          const elapsed = now - start;
          let allDone = true;

          for (const state of states) {
            if (state.space) {
              const t = Math.min(1, elapsed / 500);
              state.el.style.opacity = String(t);
              state.el.style.transform = 'none';
              continue;
            }

            const local = elapsed - state.delay;
            if (local < 0) {
              allDone = false;
              applyLetter(state.el, state.x0, state.y0, state.rot0, state.scale0, 0);
              continue;
            }

            if (!state.started) {
              state.started = true;
              dropSound(dropCount++);
            }

            const t = Math.min(1, local / state.flight);
            if (t < 1) allDone = false;
            const p = easeOutBackSoft(t);
            const curve = Math.sin(Math.min(1, t) * Math.PI);
            const x = lerp(state.x0, 0, p) + state.mx * curve;
            const y = lerp(state.y0, 0, p) + state.my * curve;
            const rot = lerp(state.rot0, 0, easeOutQuart(t));
            const scale = lerp(state.scale0, 1, p);
            const opacity = Math.min(1, t / 0.18);
            if (t >= 1 && !state.locked) {
              state.locked = true;
              state.el.style.opacity = '1';
              state.el.style.transform = 'none';
            } else if (!state.locked) {
              applyLetter(state.el, x, y, rot, scale, opacity);
            }
          }

          if (allDone) {
            animFrame = 0;
            resolve();
            return;
          }
          animFrame = requestAnimationFrame(tick);
        };

        animFrame = requestAnimationFrame(tick);
      });
    }

    async function reveal() {
      if (running) return;
      running = true;

      pressButton.classList.add('pressed');
      clickSound();
      sendPress();

      await new Promise((resolve) => setTimeout(resolve, PRESS_MS));
      startScreen.classList.add('hidden');
      revealScreen.classList.remove('hidden');

      const message = nextLine();
      const letters = buildLetters(message);
      await waitFrames(2);
      fitText();
      await waitFrames(2);

      if (reducedMotion()) {
        letters.forEach((letter) => {
          letter.style.opacity = '1';
          letter.style.transform = 'none';
        });
        finishSound();
        restart.classList.add('show');
        running = false;
        return;
      }

      const states = makeStates(letters);
      states.forEach((state) => {
        if (state.space) {
          state.el.style.opacity = '0';
          state.el.style.transform = 'none';
        } else {
          applyLetter(state.el, state.x0, state.y0, state.rot0, state.scale0, 0);
        }
      });

      await animateLetters(states);
      finishSound();
      restart.classList.add('show');
      running = false;
    }

    function reset() {
      cancelAnimationFrame(animFrame);
      animFrame = 0;
      restart.classList.remove('show');
      revealScreen.classList.add('hidden');
      startScreen.classList.remove('hidden');
      pressButton.classList.remove('pressed');
      finalText.innerHTML = '';
      finalText.style.fontSize = '';
      running = false;
    }

    pressButton.addEventListener('click', reveal);
    restart.addEventListener('click', reset);
    window.addEventListener('resize', () => {
      if (finalText.querySelector('.letter')) fitText();
    });
    window.__CASINO = {
      LINES,
      nextLine,
      forceLine(text) {
        deck = [text];
        lastLine = null;
      },
      layoutLine,
      reset
    };
    loadCount();
  </script>
</body>
</html>
